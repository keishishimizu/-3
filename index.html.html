<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>身近な家電で学ぶ！論理回路クエスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .workspace {
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
      background-size: 20px 20px;
    }
    .node {
      width: 14px; height: 14px; border-radius: 50%;
      background: #94a3b8; border: 2px solid #475569;
      position: absolute; cursor: pointer; transition: transform 0.15s, background-color 0.15s; z-index: 30;
    }
    .node:hover { transform: scale(1.4); }
    .node.input-node { left: -7px; }
    .node.output-node { right: -7px; }
    .node.active { background: #ef4444; border-color: #991b1b; box-shadow: 0 0 6px rgba(239, 68, 68, 0.8); }
    .bulb-on { color: #f59e0b; filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.9)); }
    @keyframes clearPop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-clear { animation: clearPop 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col">

  <!-- クリア時ポップアップ -->
  <div id="clearOverlay" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="bg-white rounded-3xl p-8 border-4 border-amber-400 shadow-2xl text-center max-w-md animate-clear">
      <div class="w-20 h-20 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl shadow-inner">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-2xl font-black text-slate-800 mb-1">MISSION CLEAR!!</h2>
      <p class="text-xs text-slate-500 mb-6" id="clearMsg">見事！要求されたシステム仕様に合致する正確な論理回路を構築できました！</p>
      <button onclick="nextStage()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-500/30 transition">
        次のミッションへ挑戦 <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-6 py-2.5 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md shadow-blue-500/20">
        <i class="fa-solid fa-house-laptop text-xl"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-800">身近な家電で学ぶ！論理回路クエスト</h1>
        <p class="text-[11px] text-slate-500">生活の中のプログラミング思考（情報Ⅰ対応）</p>
      </div>
    </div>

    <!-- ステージ選択 -->
    <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200">
      <span class="text-xs font-bold text-slate-500 pl-2"><i class="fa-solid fa-list-check text-blue-500"></i> ミッション:</span>
      <select id="stageSelect" onchange="changeStage()" class="bg-white text-xs font-bold text-slate-700 px-3 py-1.5 rounded-xl border border-slate-200 shadow-xs focus:outline-none">
        <option value="0">自由作成モード（フリー）</option>
        <option value="1">STAGE 1: 自動ドア（基本配線）</option>
        <option value="2">STAGE 2: 冷蔵庫アラーム（NOT回路）</option>
        <option value="3">STAGE 3: センサー付き自動街灯（AND回路）</option>
        <option value="4">STAGE 4: 火災報知器と非常ベル（OR回路）</option>
        <option value="5">STAGE 5: スマートエアコン（基本複合）</option>
        <option value="6">STAGE 6: 温室の自動換気システム（3入力条件）</option>
        <option value="7">STAGE 7: 高級車のアラーム（否定と複合条件）</option>
        <option value="8">STAGE 8: 銀行ATMの送金ブロック（マルチ保護）</option>
        <option value="9">STAGE 9: 金庫の多段階ロック（多重分岐回路）</option>
        <option value="10">STAGE 10: 自動運転AIの緊急ブレーキ（高精度制御）</option>
      </select>
    </div>

    <div class="flex gap-2">
      <button onclick="shareState()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-share-nodes"></i> URL共有
      </button>
      <button onclick="resetStage()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-rotate-left"></i> リセット
      </button>
    </div>
  </header>

  <!-- ミッションバー -->
  <div id="missionBar" class="bg-indigo-50 border-b border-indigo-100 px-6 py-2.5 flex justify-between items-center hidden">
    <div class="flex items-center gap-2">
      <span class="bg-indigo-600 text-white text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider">Mission</span>
      <p id="missionText" class="text-xs font-bold text-indigo-950"></p>
    </div>
    <div class="text-xs font-bold text-indigo-700" id="missionHint"></div>
  </div>

  <!-- メインコンテンツ -->
  <div class="flex-1 flex overflow-hidden">
    <!-- パレット -->
    <aside class="w-72 bg-white border-r border-slate-200 p-4 flex flex-col gap-4 shadow-sm z-10 overflow-y-auto">
      <div>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">パーツをドラッグ＆ドロップ</h2>

        <div class="space-y-2 mb-3">
          <p class="text-xs font-bold text-slate-600 flex items-center gap-1"><i class="fa-solid fa-sliders text-blue-500"></i> センサー / 出力パーツ</p>
          <div class="grid grid-cols-2 gap-2">
            <div draggable="true" ondragstart="dragStartFromPalette(event, 'switch')" class="bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 p-2.5 rounded-xl cursor-grab flex flex-col items-center justify-center transition shadow-sm">
              <i class="fa-solid fa-toggle-on text-emerald-500 text-xl mb-1"></i>
              <span class="text-[11px] font-bold text-slate-700">スイッチ/センサー</span>
            </div>
            <div draggable="true" ondragstart="dragStartFromPalette(event, 'bulb')" class="bg-slate-50 hover:bg-amber-50 border border-slate-200 hover:border-amber-300 p-2.5 rounded-xl cursor-grab flex flex-col items-center justify-center transition shadow-sm">
              <i class="fa-solid fa-lightbulb text-amber-500 text-xl mb-1"></i>
              <span class="text-[11px] font-bold text-slate-700">ライト / アラーム</span>
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-bold text-slate-600 flex items-center gap-1"><i class="fa-solid fa-microchip text-indigo-500"></i> 論理ICパーツ</p>
          <div class="flex flex-col gap-2">
            <div draggable="true" ondragstart="dragStartFromPalette(event, 'AND')" class="bg-blue-50/60 hover:bg-blue-100/80 border border-blue-200 p-2.5 rounded-xl cursor-grab flex items-center gap-3 transition shadow-sm">
              <span class="font-black text-blue-600 text-xs w-10 text-center border border-blue-300 bg-white py-0.5 rounded shadow-xs">AND</span>
              <div class="text-[11px] font-bold text-slate-700">AND (両方ONで動作)</div>
            </div>
            <div draggable="true" ondragstart="dragStartFromPalette(event, 'OR')" class="bg-indigo-50/60 hover:bg-indigo-100/80 border border-indigo-200 p-2.5 rounded-xl cursor-grab flex items-center gap-3 transition shadow-sm">
              <span class="font-black text-indigo-600 text-xs w-10 text-center border border-indigo-300 bg-white py-0.5 rounded shadow-xs">OR</span>
              <div class="text-[11px] font-bold text-slate-700">OR (どちらかで動作)</div>
            </div>
            <div draggable="true" ondragstart="dragStartFromPalette(event, 'NOT')" class="bg-purple-50/60 hover:bg-purple-100/80 border border-purple-200 p-2.5 rounded-xl cursor-grab flex items-center gap-3 transition shadow-sm">
              <span class="font-black text-purple-600 text-xs w-10 text-center border border-purple-300 bg-white py-0.5 rounded shadow-xs">NOT</span>
              <div class="text-[11px] font-bold text-slate-700">NOT (信号を反転)</div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-auto bg-blue-50 p-3 rounded-xl border border-blue-100 text-[11px] text-slate-600 space-y-1">
        <p class="font-bold text-blue-900"><i class="fa-solid fa-circle-info text-blue-500"></i> クリアのコツ:</p>
        <p>正しく回路を配線し、問題で求められているスイッチ状態にセットするとクリアになります！</p>
      </div>
    </aside>

    <!-- ワークスペース -->
    <main class="flex-1 relative workspace overflow-hidden" id="workspace" ondragover="allowDrop(event)" ondrop="dropFromPalette(event)">
      <svg id="wireSvg" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>
      <div id="nodesContainer" class="absolute inset-0"></div>
    </main>
  </div>

  <script>
    let components = [];
    let wires = [];
    let wireStartNode = null;
    let nextId = 1;

    let currentStage = 0;
    let isStageCleared = false;

    let draggingComponent = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    const stages = {
      1: {
        title: "【自動ドア】「人感センサー」が反応したとき(ON)だけドア（ライト）が開く回路を作ろう！",
        hint: "スイッチをONにしたとき、ライトが点灯するように繋ごう！",
        setup: () => {
          createComponent('switch', 100, 200, '人感センサー');
          createComponent('bulb', 450, 200, 'ドアモーター');
        }
      },
      2: {
        title: "【冷蔵庫アラーム】ドア閉＝1(ON)、ドア開＝0(OFF)。「ドアが開いた(OFF)」ときに警告音が鳴る回路を作ろう！",
        hint: "NOT回路を使って、スイッチをOFFにするとライトが点灯するようにしよう！",
        setup: () => {
          createComponent('switch', 100, 200, 'ドア検知(1:閉/0:開)');
          createComponent('bulb', 450, 200, '警告アラーム');
        }
      },
      3: {
        title: "【自動街灯】「周りが暗い(ON)」かつ「人が近づいた(ON)」の両方が揃った時だけ点灯させよう！",
        hint: "AND回路を使って、両方のスイッチをONにした時に点灯するようにしよう！",
        setup: () => {
          createComponent('switch', 80, 140, '明るさ(1:暗い)');
          createComponent('switch', 80, 260, '人感(1:人あり)');
          createComponent('bulb', 480, 200, '自動街灯');
        }
      },
      4: {
        title: "【火災警報器】「火災センサー」または「手動非常ボタン」の「どちらか片方でも(ON)」反応したらベルを鳴らそう！",
        hint: "OR回路を使って、どちらか片方のスイッチをONにした時に点灯するようにしよう！",
        setup: () => {
          createComponent('switch', 80, 140, '熱センサー');
          createComponent('switch', 80, 260, '非常ボタン');
          createComponent('bulb', 480, 200, '非常ベル');
        }
      },
      5: {
        title: "【スマートエアコン】「メイン電源」がONで、かつ「【気温が高い】または【湿度が高い】」ときに冷房を起動させよう！",
        hint: "ANDとORを組み合わせて、電源ON ＋ (高温または高湿) のときに起動するようにしよう！",
        setup: () => {
          createComponent('switch', 60, 100, 'メイン電源');
          createComponent('switch', 60, 200, '高温センサー');
          createComponent('switch', 60, 300, '高湿センサー');
          createComponent('bulb', 520, 200, 'エアコン冷房');
        }
      },
      6: {
        title: "【スマート温室】「手動換気SW」がON、または「【気温が高い】かつ【湿度が低い】」時に換気ファンを起動させよう！",
        hint: "湿度が低い条件にはNOT回路を使用。「手動ON」または「高温 ＆ 乾燥」で起動！",
        setup: () => {
          createComponent('switch', 60, 80, '手動換気SW');
          createComponent('switch', 60, 180, '高温検知');
          createComponent('switch', 60, 280, '湿度検知(1:高/0:低)');
          createComponent('bulb', 540, 180, '換気ファン');
        }
      },
      7: {
        title: "【高級車アラーム】「セキュリティ起動(1)」かつ「衝撃検知(1)」かつ「スマートキー非所持(0)」のときにアラームを作動！",
        hint: "スマートキー非所持(0)はNOT回路で1に変換。3つの条件がANDで揃った時に起動！",
        setup: () => {
          createComponent('switch', 50, 80, 'セキュリティON');
          createComponent('switch', 50, 180, '衝撃センサー');
          createComponent('switch', 50, 280, 'スマートキー(1:あり)');
          createComponent('bulb', 560, 180, '防犯アラーム');
        }
      },
      8: {
        title: "【ATM不正保護】「緊急停止なし(0)」かつ「PIN一致(1)」かつ「【指紋認証成功(1)】または【高額でない(0)】」で口座有効化！",
        hint: "「停止なし(0)」「高額でない(0)」はNOT回路を通します。論理式をしっかり組み立てよう！",
        setup: () => {
          createComponent('switch', 40, 60, '緊急停止(1:停止)');
          createComponent('switch', 40, 140, 'PIN一致');
          createComponent('switch', 40, 220, '指紋照合');
          createComponent('switch', 40, 300, '高額送金(1:高額)');
          createComponent('bulb', 580, 180, '取引許可ランプ');
        }
      },
      9: {
        title: "【金庫多重ロック】「(A)マスターキー(1)＆PIN(1)」または「(B)営業時間内(1)＆PIN(1)＆(指紋(1) OR 静脈(1))」で解錠！",
        hint: "PIN入力は(A)と(B)両方で必要。ORとANDが複数絡み合う難関回路！",
        setup: () => {
          createComponent('switch', 40, 50, 'マスターキー');
          createComponent('switch', 40, 120, 'PIN一致');
          createComponent('switch', 40, 190, '営業時間内');
          createComponent('switch', 40, 260, '指紋一致');
          createComponent('switch', 40, 330, '静脈一致');
          createComponent('bulb', 600, 190, '金庫ロック解除');
        }
      },
      10: {
        title: "【自動運転ブレーキ】「断線異常なし(0)」かつ「【ドライバー踏み込み(1)】または【障害物(1)＆自動運転(1)＆システムエラーなし(0)】」で緊急ブレーキ！",
        hint: "システム制御の最高峰！「異常なし」「エラーなし」のNOT回路とAND/ORを正確に構築しよう！",
        setup: () => {
          createComponent('switch', 40, 40, '回路断線(1:異常)');
          createComponent('switch', 40, 110, 'ブレーキペダル');
          createComponent('switch', 40, 180, '前方障害物');
          createComponent('switch', 40, 250, '自動運転モード');
          createComponent('switch', 40, 320, 'システムエラー(1:有)');
          createComponent('bulb', 620, 180, '緊急自動ブレーキ');
        }
      }
    };

    function dragStartFromPalette(e, type) { e.dataTransfer.setData("paletteType", type); }
    function allowDrop(e) { e.preventDefault(); }

    function dropFromPalette(e) {
      e.preventDefault();
      const type = e.dataTransfer.getData("paletteType");
      if (!type) return;
      const rect = document.getElementById('workspace').getBoundingClientRect();
      createComponent(type, Math.max(20, e.clientX - rect.left - 50), Math.max(20, e.clientY - rect.top - 30));
    }

    function createComponent(type, x, y, customLabel = null) {
      const id = `comp_${nextId++}`;
      const comp = { id, type, x, y, state: false, inputs: [], outputs: [], label: customLabel };

      if (type === 'switch') comp.outputs = [{ id: `${id}_out_0`, value: false }];
      else if (type === 'bulb') comp.inputs = [{ id: `${id}_in_0`, value: false }];
      else if (type === 'NOT') {
        comp.inputs = [{ id: `${id}_in_0`, value: false }];
        comp.outputs = [{ id: `${id}_out_0`, value: false }];
      } else if (type === 'AND' || type === 'OR') {
        comp.inputs = [{ id: `${id}_in_0`, value: false }, { id: `${id}_in_1`, value: false }];
        comp.outputs = [{ id: `${id}_out_0`, value: false }];
      }

      components.push(comp);
      render();
      updateCircuit();
    }

    function removeComponent(id) {
      components = components.filter(c => c.id !== id);
      wires = wires.filter(w => !w.from.startsWith(id) && !w.to.startsWith(id));
      render();
      updateCircuit();
    }

    function toggleSwitch(id) {
      const comp = components.find(c => c.id === id);
      if (comp && comp.type === 'switch') {
        comp.state = !comp.state;
        comp.outputs[0].value = comp.state;
        updateCircuit();
      }
    }

    function startMovingComponent(e, id) {
      if (e.target.closest('button') || e.target.classList.contains('node')) return;
      draggingComponent = components.find(c => c.id === id);
      if (!draggingComponent) return;

      const rect = document.getElementById(id).getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;

      window.addEventListener('mousemove', moveComponent);
      window.addEventListener('mouseup', stopMovingComponent);
    }

    function moveComponent(e) {
      if (!draggingComponent) return;
      const wsRect = document.getElementById('workspace').getBoundingClientRect();
      let x = Math.max(10, Math.min(e.clientX - wsRect.left - dragOffsetX, wsRect.width - 130));
      let y = Math.max(10, Math.min(e.clientY - wsRect.top - dragOffsetY, wsRect.height - 90));

      draggingComponent.x = x;
      draggingComponent.y = y;
      const el = document.getElementById(draggingComponent.id);
      if (el) { el.style.left = `${x}px`; el.style.top = `${y}px`; }
      renderWires();
    }

    function stopMovingComponent() {
      draggingComponent = null;
      window.removeEventListener('mousemove', moveComponent);
      window.removeEventListener('mouseup', stopMovingComponent);
    }

    function handleNodeClick(nodeId) {
      if (!wireStartNode) {
        wireStartNode = nodeId;
        highlightNode(nodeId, true);
      } else {
        if (wireStartNode !== nodeId) {
          const isStartOut = wireStartNode.includes('_out_');
          const isEndIn = nodeId.includes('_in_');

          if (isStartOut && isEndIn) {
            wires = wires.filter(w => w.to !== nodeId);
            wires.push({ from: wireStartNode, to: nodeId });
          } else if (!isStartOut && !isEndIn) {
            const isStartIn = wireStartNode.includes('_in_');
            const isEndOut = nodeId.includes('_out_');
            if (isStartIn && isEndOut) {
              wires = wires.filter(w => w.to !== wireStartNode);
              wires.push({ from: nodeId, to: wireStartNode });
            }
          }
        }
        highlightNode(wireStartNode, false);
        wireStartNode = null;
        updateCircuit();
      }
    }

    function highlightNode(nodeId, enable) {
      const el = document.getElementById(nodeId);
      if (el) {
        if (enable) el.classList.add('ring-4', 'ring-amber-400');
        else el.classList.remove('ring-4', 'ring-amber-400');
      }
    }

    function updateCircuit() {
      for (let iter = 0; iter < 10; iter++) {
        wires.forEach(w => {
          const fromComp = components.find(c => c.outputs.some(o => o.id === w.from));
          const toComp = components.find(c => c.inputs.some(i => i.id === w.to));
          if (fromComp && toComp) {
            const outObj = fromComp.outputs.find(o => o.id === w.from);
            const inObj = toComp.inputs.find(i => i.id === w.to);
            if (outObj && inObj) inObj.value = outObj.value;
          }
        });

        components.forEach(c => {
          if (c.type === 'switch') c.outputs[0].value = c.state;
          else if (c.type === 'NOT') c.outputs[0].value = !c.inputs[0].value;
          else if (c.type === 'AND') c.outputs[0].value = Boolean(c.inputs[0].value && c.inputs[1].value);
          else if (c.type === 'OR') c.outputs[0].value = Boolean(c.inputs[0].value || c.inputs[1].value);
          else if (c.type === 'bulb') c.state = Boolean(c.inputs[0].value);
        });
      }

      renderWires();
      updateVisuals();
      checkGameClear();
    }

    function render() {
      const container = document.getElementById('nodesContainer');
      container.innerHTML = '';

      components.forEach(c => {
        const div = document.createElement('div');
        div.id = c.id;
        div.className = `absolute bg-white border-2 rounded-2xl shadow-md p-3 z-20 flex flex-col items-center justify-between min-w-[120px] cursor-move transition-shadow ${c.type === 'bulb' && c.state ? 'border-amber-400 shadow-amber-300/60 shadow-lg' : 'border-slate-300 hover:border-blue-400'}`;
        div.style.left = `${c.x}px`;
        div.style.top = `${c.y}px`;
        div.onmousedown = (e) => startMovingComponent(e, c.id);

        const header = document.createElement('div');
        header.className = 'w-full flex justify-between items-center mb-1 pointer-events-none gap-2';
        header.innerHTML = `<span class="text-[10px] font-bold text-slate-500 truncate">${c.label || c.type}</span>
          <button onclick="removeComponent('${c.id}')" class="text-slate-300 hover:text-rose-500 text-xs pointer-events-auto p-0.5">✕</button>`;
        div.appendChild(header);

        const body = document.createElement('div');
        body.className = 'my-1 flex items-center justify-center';
        if (c.type === 'switch') {
          body.innerHTML = `<button id="btn_${c.id}" onclick="toggleSwitch('${c.id}')" class="px-3 py-1.5 rounded-xl font-bold text-xs transition shadow-sm ${c.state ? 'bg-emerald-500 text-white shadow-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-300'}">
            ${c.state ? 'ON (1)' : 'OFF (0)'}</button>`;
        } else if (c.type === 'bulb') {
          body.innerHTML = `<i id="bulb_icon_${c.id}" class="fa-solid fa-lightbulb text-3xl transition-all duration-200 ${c.state ? 'bulb-on' : 'text-slate-300'}"></i>`;
        } else {
          body.innerHTML = `<span class="font-black text-base text-slate-700 tracking-wider">${c.type}</span>`;
        }
        div.appendChild(body);

        c.inputs.forEach((inp, idx) => {
          const node = document.createElement('div');
          node.id = inp.id;
          node.className = `node input-node ${inp.value ? 'active' : ''}`;
          node.style.top = `${(idx + 1) * (100 / (c.inputs.length + 1))}%`;
          node.onclick = (e) => { e.stopPropagation(); handleNodeClick(inp.id); };
          div.appendChild(node);
        });

        c.outputs.forEach((out, idx) => {
          const node = document.createElement('div');
          node.id = out.id;
          node.className = `node output-node ${out.value ? 'active' : ''}`;
          node.style.top = `${(idx + 1) * (100 / (c.outputs.length + 1))}%`;
          node.onclick = (e) => { e.stopPropagation(); handleNodeClick(out.id); };
          div.appendChild(node);
        });

        container.appendChild(div);
      });

      renderWires();
    }

    function updateVisuals() {
      components.forEach(c => {
        c.inputs.forEach(inp => {
          const el = document.getElementById(inp.id);
          if (el) el.className = `node input-node ${inp.value ? 'active' : ''}`;
        });
        c.outputs.forEach(out => {
          const el = document.getElementById(out.id);
          if (el) el.className = `node output-node ${out.value ? 'active' : ''}`;
        });

        if (c.type === 'switch') {
          const btn = document.getElementById(`btn_${c.id}`);
          if (btn) {
            btn.innerText = c.state ? 'ON (1)' : 'OFF (0)';
            btn.className = `px-3 py-1.5 rounded-xl font-bold text-xs transition shadow-sm ${c.state ? 'bg-emerald-500 text-white shadow-emerald-200' : 'bg-slate-100 text-slate-500 border border-slate-300'}`;
          }
        }

        if (c.type === 'bulb') {
          const icon = document.getElementById(`bulb_icon_${c.id}`);
          const card = document.getElementById(c.id);
          if (icon) icon.className = `fa-solid fa-lightbulb text-3xl transition-all duration-200 ${c.state ? 'bulb-on' : 'text-slate-300'}`;
          if (card) {
            if (c.state) card.classList.add('border-amber-400', 'shadow-amber-300/60', 'shadow-lg');
            else card.classList.remove('border-amber-400', 'shadow-amber-300/60', 'shadow-lg');
          }
        }
      });
    }

    function renderWires() {
      const svg = document.getElementById('wireSvg');
      svg.innerHTML = '';

      wires.forEach(w => {
        const fromEl = document.getElementById(w.from);
        const toEl = document.getElementById(w.to);
        if (!fromEl || !toEl) return;

        const r1 = fromEl.getBoundingClientRect();
        const r2 = toEl.getBoundingClientRect();
        const wRect = document.getElementById('workspace').getBoundingClientRect();

        const x1 = r1.left + r1.width/2 - wRect.left;
        const y1 = r1.top + r1.height/2 - wRect.top;
        const x2 = r2.left + r2.width/2 - wRect.left;
        const y2 = r2.top + r2.height/2 - wRect.top;

        const fromComp = components.find(c => c.outputs.some(o => o.id === w.from));
        const isActive = fromComp ? fromComp.outputs.find(o => o.id === w.from).value : false;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const dx = Math.abs(x2 - x1) * 0.5;
        path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
        path.setAttribute('stroke', isActive ? '#ef4444' : '#cbd5e1');
        path.setAttribute('stroke-width', isActive ? '4' : '3');
        path.setAttribute('fill', 'none');
        svg.appendChild(path);
      });
    }

    // --- リアルタイムクリア判定 ---
    function checkGameClear() {
      if (currentStage === 0 || isStageCleared) return;

      const switches = components.filter(c => c.type === 'switch');
      const bulbs = components.filter(c => c.type === 'bulb');
      if (bulbs.length === 0) return;

      // 未接続の入力端子があるパーツがないかチェック（未完成回路を排除）
      const hasUnconnectedInput = components.some(c => {
        if (c.type === 'switch') return false;
        return c.inputs.some(inp => !wires.some(w => w.to === inp.id));
      });
      if (hasUnconnectedInput) return;

      const bulb = bulbs[0];
      const getVal = (idx) => switches[idx] ? switches[idx].state : false;

      // 現在の回路が正解のスイッチ入力および出力（電球）を満たした時に即クリア
      let isCorrect = false;

      if (currentStage === 1) { // 1: 人感
        isCorrect = getVal(0) === true && bulb.state === true;
      } else if (currentStage === 2) { // 2: 冷蔵庫 (NOT必要)
        const hasNOT = components.some(c => c.type === 'NOT');
        isCorrect = hasNOT && getVal(0) === false && bulb.state === true;
      } else if (currentStage === 3) { // 3: 街灯 (AND)
        const hasAND = components.some(c => c.type === 'AND');
        isCorrect = hasAND && (getVal(0) && getVal(1)) && bulb.state === true;
      } else if (currentStage === 4) { // 4: 火災警報 (OR)
        const hasOR = components.some(c => c.type === 'OR');
        isCorrect = hasOR && (getVal(0) || getVal(1)) && bulb.state === true;
      } else if (currentStage === 5) { // 5: エアコン (電源 AND (高温 OR 高湿))
        const expected = getVal(0) && (getVal(1) || getVal(2));
        isCorrect = expected && bulb.state === true;
      } else if (currentStage === 6) { // 6: 温室 (手動 OR (高温 AND 低湿))
        const expected = getVal(0) || (getVal(1) && !getVal(2));
        isCorrect = expected && bulb.state === true;
      } else if (currentStage === 7) { // 7: 高級車 (セキュリティ1 AND 衝撃1 AND キー0)
        const expected = getVal(0) && getVal(1) && !getVal(2);
        isCorrect = expected && bulb.state === true;
      } else if (currentStage === 8) { // 8: ATM (停止0 AND PIN1 AND (指紋1 OR 高額0))
        const expected = !getVal(0) && getVal(1) && (getVal(2) || !getVal(3));
        isCorrect = expected && bulb.state === true;
      } else if (currentStage === 9) { // 9: 金庫 ((マスター1 AND PIN1) OR (営業1 AND PIN1 AND (指紋1 OR 静脈1)))
        const condA = getVal(0) && getVal(1);
        const condB = getVal(2) && getVal(1) && (getVal(3) || getVal(4));
        const expected = condA || condB;
        isCorrect = expected && bulb.state === true;
      } else if (currentStage === 10) { // 10: 自動運転 (断線0 AND (踏み込み1 OR (障害物1 AND 自動運転1 AND エラー0)))
        const condAuto = getVal(2) && getVal(3) && !getVal(4);
        const expected = !getVal(0) && (getVal(1) || condAuto);
        isCorrect = expected && bulb.state === true;
      }

      if (isCorrect) {
        triggerClear();
      }
    }

    function triggerClear() {
      isStageCleared = true;
      playSound();
      setTimeout(() => {
        document.getElementById('clearOverlay').classList.remove('hidden');
      }, 300);
    }

    function playSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
        osc.frequency.setValueAtTime(1046.50, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch(e){}
    }

    function nextStage() {
      document.getElementById('clearOverlay').classList.add('hidden');
      const select = document.getElementById('stageSelect');
      if (currentStage < 10) {
        select.value = currentStage + 1;
        changeStage();
      } else {
        select.value = 0;
        changeStage();
      }
    }

    function changeStage() {
      const select = document.getElementById('stageSelect');
      currentStage = parseInt(select.value);
      resetStage();
    }

    function resetStage() {
      components = [];
      wires = [];
      nextId = 1;
      isStageCleared = false;

      const bar = document.getElementById('missionBar');
      if (currentStage > 0 && stages[currentStage]) {
        bar.classList.remove('hidden');
        document.getElementById('missionText').innerText = stages[currentStage].title;
        document.getElementById('missionHint').innerText = `💡 ヒント: ${stages[currentStage].hint}`;
        stages[currentStage].setup();
      } else {
        bar.classList.add('hidden');
        render();
      }
    }

    function shareState() {
      const data = { components: components.map(c => ({ id: c.id, type: c.type, x: c.x, y: c.y, state: c.state, label: c.label })), wires, nextId };
      const shareUrl = `${window.location.origin}${window.location.pathname}?state=${encodeURIComponent(JSON.stringify(data))}`;
      navigator.clipboard.writeText(shareUrl).then(() => alert("URLをコピーしました！")).catch(() => prompt("URL:", shareUrl));
    }

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const stateParam = urlParams.get('state');
      if (stateParam) {
        try {
          const data = JSON.parse(decodeURIComponent(stateParam));
          components = data.components.map(c => ({
            ...c,
            inputs: c.type === 'switch' ? [] : (c.type === 'NOT' || c.type === 'bulb' ? [{id:`${c.id}_in_0`, value:false}] : [{id:`${c.id}_in_0`, value:false},{id:`${c.id}_in_1`, value:false}]),
            outputs: c.type === 'bulb' ? [] : [{id:`${c.id}_out_0`, value:c.state}]
          }));
          wires = data.wires || [];
          nextId = data.nextId || (components.length + 1);
          render();
          updateCircuit();
        } catch(e){}
      }
    };
    window.onresize = renderWires;
  </script>
</body>
